[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:debugging"

[tool.coverage.run]
branch = true
source = ["ota", "flightlogic"]
omit = ["code.py", "boot.py", "demo_feed.py", "tests/*", "tools/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]